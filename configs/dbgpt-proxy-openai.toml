[system]
language = "${env:DBGPT_LANG:-en}"
api_keys = []
encrypt_key = "${env:DBGPT_ENCRYPT_KEY}"

[service.web]
host = "127.0.0.1"
port = 5670

[service.web.database]
type = "sqlite"
path = "pilot/meta_data/dbgpt.db"

[rag.storage]
[rag.storage.vector]
type = "chroma"
persist_path = "pilot/data"

# Model Configurations
[models]

# Hotel-BE's agent/config/config.yaml is the provider/model authority for this
# manufacturing runtime. Credentials remain runtime inputs; this file does not
# create, rotate, or rename them.

# ── Default: MiniMax-M3 (Anthropic-compatible endpoint) ──
[[models.llms]]
name = "MiniMax-M3"
provider = "proxy/claude"
api_base = "https://api.minimax.io/anthropic"
api_key = "${env:MINIMAX_API_KEY}"

# ── Kimi retry model (Anthropic-compatible endpoint) ──
[[models.llms]]
name = "kimi2.7"
provider = "proxy/claude"
api_base = "https://api.kimi.com/coding/"
api_key = "${env:KIMI_API_KEY}"

# ── GLM judge/fallback model (Anthropic-compatible endpoint) ──
[[models.llms]]
name = "glm-5.2"
provider = "proxy/claude"
api_base = "https://api.z.ai/api/anthropic"
api_key = "${env:ZAI_API_KEY}"

# Embedding: Ollama local (nomic-embed-text, 768-dim)
[[models.embeddings]]
name = "nomic-embed-text"
provider = "proxy/ollama"
